<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú Digital</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root { --primary-color: #eab308; }
    body { background-color: #09090b; color: #e5e7eb; }
    .text-primary { color: var(--primary-color); }
    .bg-primary { background-color: var(--primary-color); }
    .border-primary { border-color: var(--primary-color); }
  </style>
</head>
<body class="font-sans pb-24">

  <!-- HEADER DEL NEGOCIO -->
  <header id="header-local" class="bg-zinc-900 border-b border-zinc-800 p-4 sticky top-0 z-30 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img id="local-logo" src="https://via.placeholder.com/60" class="w-12 h-12 rounded-full object-cover border border-zinc-700">
        <div>
          <h1 id="local-nombre" class="font-bold text-base text-white">Cargando menú...</h1>
          <p id="local-estado" class="text-xs text-zinc-400">Verificando local...</p>
        </div>
      </div>
      <div id="local-badge-abierto"></div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- BANNER / PROMO DEL DÍA -->
    <div id="promo-container" class="hidden bg-zinc-900 border border-amber-500/30 rounded-2xl p-4 space-y-2 shadow-lg">
      <div class="flex items-center gap-2 text-amber-400 font-bold text-xs uppercase tracking-wider">
        🔥 Destacado del Día
      </div>
      <img id="promo-img" src="" class="w-full h-40 object-cover rounded-xl hidden">
      <p id="promo-txt" class="text-xs text-zinc-300"></p>
    </div>

    <!-- FILTRO DE CATEGORÍAS -->
    <div id="categorias-container" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
      <button onclick="filtrarCategoria('todos')" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold bg-primary text-black whitespace-nowrap shadow">Todos</button>
    </div>

    <!-- LISTA DE PRODUCTOS -->
    <div id="productos-container" class="space-y-3">
      <!-- Los productos se cargan aquí dinámicamente -->
    </div>

  </main>

  <!-- BOTÓN FLOTANTE DEL CARRITO -->
  <div id="carrito-flotante" class="fixed bottom-0 left-0 right-0 p-4 bg-zinc-900/95 border-t border-zinc-800 backdrop-blur-md z-40 hidden">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <p class="text-xs text-zinc-400">Total en Carrito</p>
        <p id="carrito-total" class="font-extrabold text-lg text-white">$0</p>
      </div>
      <button onclick="abrirModalCheckout()" class="px-6 py-3 bg-primary text-black font-extrabold rounded-xl text-sm shadow-lg">
        Ver Pedido 🛒
      </button>
    </div>
  </div>

  <!-- MODAL DE CHECKOUT / DATOS DE ENVÍO -->
  <div id="modal-checkout" class="fixed inset-0 bg-black/80 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden backdrop-blur-sm">
    <div class="bg-zinc-900 border border-zinc-800 w-full max-w-md rounded-t-3xl sm:rounded-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-zinc-800 pb-3">
        <h2 class="font-bold text-base text-white">🛍️ Finalizar tu Pedido</h2>
        <button onclick="cerrarModalCheckout()" class="text-zinc-400 font-bold text-sm">✕</button>
      </div>

      <div id="resumen-carrito" class="space-y-2 text-xs text-zinc-300 max-h-40 overflow-y-auto pr-1"></div>

      <div class="space-y-3 pt-2 border-t border-zinc-800">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Tipo de Entrega</label>
          <select id="tipo-entrega" onchange="actualizarTotal()" class="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-white">
            <option value="delivery">🛵 Envío a Domicilio</option>
            <option value="retiro">🏃 Retiro por el Local</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Nombre y Apellido</label>
          <input type="text" id="cliente-nombre" placeholder="Ej: Juan Pérez" class="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-white">
        </div>
        <div id="campo-direccion">
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Dirección de Entrega</label>
          <input type="text" id="cliente-direccion" placeholder="Ej: Av. San Martín 456" class="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-white">
        </div>
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1">Método de Pago</label>
          <select id="metodo-pago" class="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-sm text-white">
            <option value="Efectivo">💵 Efectivo</option>
            <option value="Mercado Pago (Alias/Transferencia)">📱 Transferencia / Alias</option>
            <option value="Link de Pago MP">💳 Tarjeta / Link de Mercado Pago</option>
          </select>
        </div>
      </div>

      <button onclick="enviarPedidoWhatsApp()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-xl text-sm shadow-lg transition-all">
        Enviar Pedido por WhatsApp 🚀
      </button>
    </div>
  </div>

  <!-- LÓGICA DE CARGA DINÁMICA -->
  <script>
    const SUPABASE_URL = 'https://wtzdqbxclqyreroqfgfm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind0emRxYnhjbHF5cmVyb3FmZ2ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3Njg4OTIsImV4cCI6MjEwODM0NDg5Mn0.hafxXt6APeOD8GTmank7XdeVL-jvfeL-44Rbk1jTT3Q';

    const _supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let userIdNegocio = null;
    let datosConfig = {};
    let productosNegocio = [];
    let carrito = [];
    let categoriaActiva = 'todos';

    document.addEventListener('DOMContentLoaded', async () => {
      // Obtener el ID del negocio desde la URL (Ejemplo: index.html?u=UUID_DEL_USUARIO)
      const params = new URLSearchParams(window.location.search);
      userIdNegocio = params.get('u');

      if (!userIdNegocio) {
        document.getElementById('local-nombre').textContent = "Negocio no especificado";
        document.getElementById('local-estado').textContent = "Por favor ingresa con un enlace válido (ej: ?u=tu_id)";
        return;
      }

      await cargarDatosComercio();
    });

    async function cargarDatosComercio() {
      try {
        // 1. Cargar Configuración del negocio
        const { data: config } = await _supabaseClient
          .from('configuracion')
          .select('*')
          .eq('user_id', userIdNegocio)
          .maybeSingle();

        if (!config) {
          document.getElementById('local-nombre').textContent = "Local no encontrado";
          return;
        }

        datosConfig = config;
        document.getElementById('local-nombre').textContent = config.nombre || 'Menú Digital';
        document.getElementById('local-estado').textContent = config.direccion || '';
        if (config.logo_url) document.getElementById('local-logo').src = config.logo_url;

        // Estado Abierto / Cerrado
        const badge = document.getElementById('local-badge-abierto');
        if (config.abierto) {
          badge.innerHTML = '<span class="px-3 py-1 bg-emerald-950 text-emerald-400 border border-emerald-800/50 rounded-full text-[10px] font-bold">🟢 Abierto</span>';
        } else {
          badge.innerHTML = '<span class="px-3 py-1 bg-rose-950 text-rose-400 border border-rose-800/50 rounded-full text-[10px] font-bold">🔴 Cerrado</span>';
        }

        // Aplicar color personalizado si existe
        if (config.color_primario) {
          document.documentElement.style.setProperty('--primary-color', config.color_primario);
        }

        // 2. Cargar Promoción activa (si tiene menos de 12 horas)
        await cargarPromoActiva();

        // 3. Cargar Productos del Negocio
        await cargarProductosComercio();

      } catch (e) {
        console.error("Error cargando comercio:", e);
      }
    }

    async function cargarPromoActiva() {
      try {
        const { data: promo } = await _supabaseClient
          .from('promociones')
          .select('*')
          .eq('user_id', userIdNegocio)
          .order('creado_en', { ascending: false })
          .limit(1)
          .maybeSingle();

        if (promo) {
          const hace12Horas = new Date(Date.now() - 12 * 60 * 60 * 1000);
          if (new Date(promo.creado_en) > hace12Horas) {
            document.getElementById('promo-container').classList.remove('hidden');
            document.getElementById('promo-txt').textContent = promo.texto_promo || '';
            if (promo.imagen_url) {
              const img = document.getElementById('promo-img');
              img.src = promo.imagen_url;
              img.classList.remove('hidden');
            }
          }
        }
      } catch (e) {}
    }

    async function cargarProductosComercio() {
      try {
        const { data } = await _supabaseClient
          .from('productos')
          .select('*')
          .eq('user_id', userIdNegocio);

        productosNegocio = data || [];
        renderizarCategorias();
        renderizarProductos();
      } catch (e) {}
    }

    function renderizarCategorias() {
      const cats = ['todos', ...new Set(productosNegocio.map(p => p.categoria).filter(Boolean))];
      const container = document.getElementById('categorias-container');
      container.innerHTML = '';

      cats.forEach(cat => {
        const isActive = categoriaActiva === cat;
        container.innerHTML += `
          <button onclick="filtrarCategoria('${cat}')" class="cat-btn px-4 py-2 rounded-xl text-xs font-bold transition-all ${isActive ? 'bg-primary text-black shadow' : 'bg-zinc-900 text-zinc-400 border border-zinc-800'} whitespace-nowrap">
            ${cat.charAt(0).toUpperCase() + cat.slice(1)}
          </button>
        `;
      });
    }

    function filtrarCategoria(cat) {
      categoriaActiva = cat;
      renderizarCategorias();
      renderizarProductos();
    }

    function renderizarProductos() {
      const container = document.getElementById('productos-container');
      container.innerHTML = '';

      const filtrados = productosNegocio.filter(p => {
        const matchCat = categoriaActiva === 'todos' || p.categoria === categoriaActiva;
        const pausado = p.pausado === true || p.pausado === 'true';
        return matchCat && !pausado;
      });

      if (filtrados.length === 0) {
        container.innerHTML = '<p class="text-center text-xs text-zinc-500 py-8">No hay productos disponibles en esta categoría.</p>';
        return;
      }

      filtrados.forEach(p => {
        const tieneDescuento = p.precio_original && p.precio_original > p.precio;
        container.innerHTML += `
          <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-3 flex gap-3 items-center shadow-sm">
            <img src="${p.imagen_url || 'https://via.placeholder.com/100'}" class="w-20 h-20 rounded-xl object-cover bg-zinc-950">
            <div class="flex-1 space-y-1">
              <h3 class="font-bold text-sm text-white">${p.nombre}</h3>
              <p class="text-xs text-zinc-400 line-clamp-2">${p.descripcion || ''}</p>
              <div class="flex items-center gap-2">
                <span class="font-extrabold text-sm text-primary">$${p.precio}</span>
                ${tieneDescuento ? `<span class="text-xs line-through text-zinc-500">$${p.precio_original}</span>` : ''}
              </div>
            </div>
            <button onclick='agregarAlCarrito(${JSON.stringify(p)})' class="p-3 bg-zinc-950 border border-zinc-800 hover:border-primary text-white rounded-xl text-sm transition-all">
              ➕
            </button>
          </div>
        `;
      });
    }

    function agregarAlCarrito(producto) {
      const existente = carrito.find(item => item.id === producto.id);
      if (existente) {
        existente.cantidad += 1;
      } else {
        carrito.push({ ...producto, cantidad: 1 });
      }
      actualizarBarraCarrito();
    }

    function actualizarBarraCarrito() {
      const totalItems = carrito.reduce((sum, i) => sum + i.cantidad, totalItems = 0);
      const totalPrecio = carrito.reduce((sum, i) => sum + (i.precio * i.cantidad), 0);

      const barra = document.getElementById('carrito-flotante');
      if (carrito.length > 0) {
        barra.classList.remove('hidden');
        document.getElementById('carrito-total').textContent = `$${totalPrecio.toLocaleString()}`;
      } else {
        barra.classList.add('hidden');
      }
    }

    function abrirModalCheckout() {
      const container = document.getElementById('resumen-carrito');
      container.innerHTML = '';

      carrito.forEach(item => {
        container.innerHTML += `
          <div class="flex justify-between items-center py-1 border-b border-zinc-800/50">
            <span>${item.cantidad}x ${item.nombre}</span>
            <span class="font-bold">$${item.precio * item.cantidad}</span>
          </div>
        `;
      });

      document.getElementById('modal-checkout').classList.remove('hidden');
    }

    function cerrarModalCheckout() {
      document.getElementById('modal-checkout').classList.add('hidden');
    }

    function enviarPedidoWhatsApp() {
      const nombre = document.getElementById('cliente-nombre').value.trim();
      const direccion = document.getElementById('cliente-direccion').value.trim();
      const tipoEntrega = document.getElementById('tipo-entrega').value;
      const metodoPago = document.getElementById('metodo-pago').value;
      const whatsappNegocio = datosConfig.whatsapp_1;

      if (!nombre) {
        alert("Por favor ingresa tu nombre.");
        return;
      }
      if (tipoEntrega === 'delivery' && !direccion) {
        alert("Por favor ingresa tu dirección para el envío.");
        return;
      }
      if (!whatsappNegocio) {
        alert("El comercio no tiene configurado un número de WhatsApp.");
        return;
      }

      let mensaje = `*¡Nuevo Pedido! 🛒*\n\n`;
      mensaje += `👤 *Cliente:* ${nombre}\n`;
      mensaje += `📦 *Tipo:* ${tipoEntrega === 'delivery' ? 'Envío a Domicilio' : 'Retiro por el local'}\n`;
      if (tipoEntrega === 'delivery') mensaje += `📍 *Dirección:* ${direccion}\n`;
      mensaje += `💳 *Pago:* ${metodoPago}\n\n`;
      mensaje += `*Detalle del pedido:*\n`;

      let total = 0;
      carrito.forEach(item => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        mensaje += `- ${item.cantidad}x ${item.nombre} ($${subtotal})\n`;
      });

      if (tipoEntrega === 'delivery' && datosConfig.costo_delivery) {
        total += parseFloat(datosConfig.costo_delivery);
        mensaje += `🛵 Envío: $${datosConfig.costo_delivery}\n`;
      }

      mensaje += `\n💰 *TOTAL A PAGAR: $${total.toLocaleString()}*`;

      const urlWa = `https://wa.me/${whatsappNegocio}?text=${encodeURIComponent(mensaje)}`;
      window.open(urlWa, '_blank');
    }
  </script>
</body>
</html>
